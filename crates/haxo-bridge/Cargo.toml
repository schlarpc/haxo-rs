[package]
name = "haxo-bridge"
version = "0.1.0"
edition = "2021"
description = "Plays haxo001's audio tap into an ALSA device, following its clock"

[dependencies]
haxo-control = { path = "../haxo-control" }
alsa = "0.7.1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rubato = "5"
serde_json = "1.0"
