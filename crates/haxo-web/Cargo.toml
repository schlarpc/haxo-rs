[package]
name = "haxo-web"
version = "0.1.0"
edition = "2021"
description = "The Haxophone's web UI: live state, Wi-Fi, Bluetooth and sounds"

[dependencies]
haxo-control = { path = "../haxo-control" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures = "0.3"
libc = "0.2"
log = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "fs", "process", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
