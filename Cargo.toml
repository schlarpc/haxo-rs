[package]
name = "haxo001"
version = "0.1.0"
authors = ["Javier Cardona <javier.cardona@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
alsa = "0.7.1"
env_logger = "0.9.0"
log = "0.4.14"
midir = "0.9.1"
rand = "0.8.0"
rppal = { version = "0.22.1", features = ["hal"] }
gpiocdev = "0.8.0"
libc = "0.2"
serde_json = "1.0"
static_assertions = "1.1.0"
structopt = "0.3.22"
time = "0.3.1"
# Bluetooth MIDI (feature "ble")
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
test-log = "0.2.12"

[build-dependencies]
vergen = { version = "8.2.6", features = ["git", "gitcl"] }

[dependencies.fluidsynth]
git = "https://github.com/scholtzan/rust-fluidsynth"

[features]
default = []
# Enable timing measurements via GPIO (UART_RXD).  Cannot be enabled when serial
# console is used.
instrumentation = []
midi = []
# A Bluetooth LE MIDI service that phones and DAWs can connect to.
ble = ["midi", "dep:bluer", "dep:tokio", "dep:futures"]
